
trigger:
- main

pr:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  JAVA_VERSION: '17'
  MAVEN_OPTS: '-Xmx1024m'

stages:

# ==================================
# Stage 1 : Build & Test
# ==================================

- stage: Build
  displayName: 'Build Spring Boot Application'

  jobs:

  - job: BuildJob
    displayName: 'Build and Test'

    steps:

    # Install Java 17
    - task: JavaToolInstaller@0
      displayName: 'Install Java 17'
      inputs:
        versionSpec: '17'
        jdkArchitectureOption: 'x64'
        jdkSourceOption: 'PreInstalled'

    # Verify Java & Maven
    - script: |
        java -version
        mvn -version
      displayName: 'Verify Java and Maven'

    # Resolve Maven Dependencies
    - task: Maven@4
      displayName: 'Resolve Maven Dependencies'
      inputs:
        mavenPomFile: 'pom.xml'
        goals: 'dependency:resolve'
        publishJUnitResults: false
        javaHomeOption: 'JDKVersion'
        mavenVersionOption: 'Default'

    # Run Tests
    - task: Maven@4
      displayName: 'Run Unit Tests'
      inputs:
        mavenPomFile: 'pom.xml'
        goals: 'test'
        publishJUnitResults: true
        testResultsFiles: '**/surefire-reports/TEST-*.xml'
        javaHomeOption: 'JDKVersion'
        mavenVersionOption: 'Default'

    # Build Application
    - task: Maven@4
      displayName: 'Build Spring Boot JAR'
      inputs:
        mavenPomFile: 'pom.xml'
        goals: 'clean package -DskipTests'
        publishJUnitResults: false
        javaHomeOption: 'JDKVersion'
        mavenVersionOption: 'Default'

    # Publish Test Results
    - task: PublishTestResults@2
      displayName: 'Publish Test Results'
      inputs:
        testResultsFiles: '**/surefire-reports/TEST-*.xml'
        testRunTitle: 'Spring Boot Test Results'
      condition: succeededOrFailed()

    # Publish Artifact
    - task: PublishBuildArtifacts@1
      displayName: 'Publish Build Artifact'
      inputs:
        PathtoPublish: 'target'
        ArtifactName: 'springboot-artifact'
        publishLocation: 'Container'


# ==================================
# Stage 2 : Deploy
# ==================================

- stage: Deploy
  displayName: 'Deploy Application'

  dependsOn: Build
  condition: succeeded()

  jobs:

  - job: DeployJob
    displayName: 'Deploy Spring Boot App'

    steps:

    # Download Artifact
    - task: DownloadBuildArtifacts@0
      displayName: 'Download Artifact'
      inputs:
        buildType: 'current'
        downloadType: 'single'
        artifactName: 'springboot-artifact'
        downloadPath: '$(System.ArtifactsDirectory)'

    # Verify Artifact
    - script: |
        echo "Checking downloaded artifact..."
        ls -R $(System.ArtifactsDirectory)
      displayName: 'Verify Artifact'

    # Deploy Step
    - script: |
        echo "Deploying Spring Boot Application..."
      displayName: 'Deploy Application'